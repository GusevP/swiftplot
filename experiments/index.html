<!doctype html><meta charset="utf-8" />
<body style="margin: 0">
  <div id="d" style="position: relative; width: 900px; height: 600px">
    <canvas id="c" width="900" height="600" style="position: absolute"></canvas>
  </div>
  <script>
    const v = new URLSearchParams(location.search).get('v');
    function prng(seed) {
      let a = seed >>> 0;
      return () => {
        a = (a + 0x9e3779b9) >>> 0;
        let t = a ^ (a >>> 16);
        t = Math.imul(t, 0x21f0aaad);
        t ^= t >>> 15;
        t = Math.imul(t, 0x735a2d97);
        t ^= t >>> 15;
        return (t >>> 0) / 4294967296;
      };
    }
    const PAL = ['#2563eb', '#dc2626', '#16a34a', '#9333ea', '#ea580c', '#0891b2', '#ca8a04', '#db2777'];
    const W = 900,
      H = 600,
      L = 56,
      B = 44,
      T = 20,
      R = 20,
      PW = W - L - R,
      PH = H - T - B;
    function scatter(points, groups) {
      const rand = prng(26);
      const gauss = () => Math.sqrt(-2 * Math.log(rand() || 1e-9)) * Math.cos(2 * Math.PI * rand());
      const out = Array.from({ length: groups }, (_, g) => ({ color: PAL[g], points: [] }));
      for (let i = 0; i < points; i++) {
        const g = i % groups;
        out[g].points.push({
          x: 20 + g * 12 + gauss() * 8,
          y: 40 + g * 6 + gauss() * 10,
          size: 3 + Math.floor(rand() * 6),
        });
      }
      return out;
    }
    function survival(series, points) {
      const rand = prng(25);
      const out = [];
      for (let s = 0; s < series; s++) {
        const td = 0.45 + 0.4 * rand();
        let y = 1,
          x = 0;
        const pts = [];
        for (let i = 0; i < points; i++) {
          x += 1 + Math.floor(rand() * 3);
          const c = rand() < 0.08;
          if (!c) y = Math.max(0.02, y - (td / points) * (2 * rand()));
          pts.push({ x, y });
        }
        out.push({ color: PAL[s], points: pts });
      }
      return out;
    }
    const c = document.getElementById('c'),
      d = document.getElementById('d');
    const N = +(new URLSearchParams(location.search).get('n') ?? 100000);
    let sc, scT, sv, svT;
    if (v.startsWith('sc')) {
      sc = scatter(N, 5);
      scT = sc.map(s => ({
        color: s.color,
        x: Float32Array.from(s.points, p => p.x),
        y: Float32Array.from(s.points, p => p.y),
        r: Float32Array.from(s.points, p => p.size),
      }));
    }
    if (v.startsWith('st')) {
      sv = survival(10, N / 10);
      svT = sv.map(s => ({
        color: s.color,
        x: Float64Array.from(s.points, p => p.x),
        y: Float64Array.from(s.points, p => p.y),
      }));
    }
    const X0 = -20,
      X1 = 120,
      Y0 = 0,
      Y1 = 120;
    const scales = { x: { min: X0, max: X1 }, y: { min: Y0, max: Y1 } };
    const valToPos = (val, key) => {
      const s = scales[key];
      const pct = (val - s.min) / (s.max - s.min);
      return key === 'x' ? L + pct * PW : T + (1 - pct) * PH;
    };
    const labels = () => {
      const a = [];
      for (let i = 0; i <= 7; i++)
        a.push({ t: String(-20 + i * 20), x: L + (i * PW) / 7, y: H - B + 16, al: 'center' });
      for (let i = 0; i <= 12; i++)
        a.push({ t: String(i * 10), x: L - 8, y: T + PH - (i * PH) / 12, al: 'right' });
      return a;
    };
    const variants = {
      'text-none'() {},
      'text-canvas'() {
        const ctx = c.getContext('2d');
        ctx.font = '12px system-ui, -apple-system, "Segoe UI", Roboto, sans-serif';
        ctx.fillStyle = '#000';
        ctx.textBaseline = 'middle';
        for (const l of labels()) {
          ctx.textAlign = l.al;
          ctx.fillText(l.t, l.x, l.y);
        }
        ctx.save();
        ctx.translate(12, H / 2);
        ctx.rotate(-Math.PI / 2);
        ctx.textAlign = 'center';
        ctx.fillText('Survival', 0, 0);
        ctx.restore();
        ctx.fillText('Days', W / 2, H - 10);
      },
      'text-dom'() {
        const f = document.createDocumentFragment();
        const mk = (t, x, y, tr) => {
          const e = document.createElement('div');
          e.textContent = t;
          e.style.cssText =
            'position:absolute;font:12px system-ui;left:' + x + 'px;top:' + y + 'px;transform:' + tr;
          f.appendChild(e);
        };
        for (const l of labels())
          mk(l.t, l.x, l.y, l.al === 'center' ? 'translate(-50%,-50%)' : 'translate(-100%,-50%)');
        mk('Survival', 12, H / 2, 'translate(-50%,-50%) rotate(-90deg)');
        mk('Days', W / 2, H - 10, 'translate(-50%,-50%)');
        d.appendChild(f);
      },
      'sc-obj'() {
        const ctx = c.getContext('2d');
        const cols = sc.map(s => [s.points.map(p => p.x), s.points.map(p => p.y), s.points.map(p => p.size)]);
        window.keep = cols;
        for (const s of sc) {
          const path = new Path2D();
          for (const p of s.points) {
            const cx = valToPos(p.x, 'x'),
              cy = valToPos(p.y, 'y'),
              r = p.size;
            path.moveTo(cx + r, cy);
            path.arc(cx, cy, r, 0, 2 * Math.PI);
          }
          ctx.fillStyle = s.color + 'b3';
          ctx.fill(path);
        }
      },
      'sc-typed'() {
        const ctx = c.getContext('2d');
        const kx = PW / (X1 - X0),
          ky = PH / (Y1 - Y0);
        for (const s of scT) {
          const path = new Path2D();
          const { x, y, r } = s;
          for (let i = 0; i < x.length; i++) {
            const cx = L + (x[i] - X0) * kx,
              cy = T + PH - (y[i] - Y0) * ky;
            path.moveTo(cx + r[i], cy);
            path.arc(cx, cy, r[i], 0, 6.283185307179586);
          }
          ctx.fillStyle = s.color + 'b3';
          ctx.fill(path);
        }
      },
      'sc-sprite'() {
        const ctx = c.getContext('2d');
        const kx = PW / (X1 - X0),
          ky = PH / (Y1 - Y0);
        for (const s of scT) {
          const sp = [];
          for (let r = 3; r <= 8; r++) {
            const o = new OffscreenCanvas(2 * r + 2, 2 * r + 2);
            const g = o.getContext('2d');
            g.fillStyle = s.color + 'b3';
            g.beginPath();
            g.arc(r + 1, r + 1, r, 0, 6.283185307179586);
            g.fill();
            sp[r] = o;
          }
          const { x, y, r } = s;
          for (let i = 0; i < x.length; i++) {
            const ri = r[i];
            ctx.drawImage(
              sp[ri],
              (L + (x[i] - X0) * kx - ri - 1 + 0.5) | 0,
              (T + PH - (y[i] - Y0) * ky - ri - 1 + 0.5) | 0,
            );
          }
        }
      },
      'sc-gl'() {
        const gl = c.getContext('webgl2', { antialias: false });
        const sh = (t, src) => {
          const s = gl.createShader(t);
          gl.shaderSource(s, src);
          gl.compileShader(s);
          return s;
        };
        const p = gl.createProgram();
        gl.attachShader(
          p,
          sh(
            gl.VERTEX_SHADER,
            '#version 300 es\nin vec3 a;uniform vec4 m;void main(){gl_Position=vec4(a.x*m.x+m.y,a.y*m.z+m.w,0,1);gl_PointSize=a.z*2.0+1.0;}',
          ),
        );
        gl.attachShader(
          p,
          sh(
            gl.FRAGMENT_SHADER,
            '#version 300 es\nprecision mediump float;uniform vec4 col;out vec4 o;void main(){float dd=length(gl_PointCoord-0.5)*2.0;float al=clamp((1.0-dd)*4.0,0.0,1.0)*col.a;if(al<=0.0)discard;o=vec4(col.rgb*al,al);}',
          ),
        );
        gl.linkProgram(p);
        gl.useProgram(p);
        gl.enable(gl.BLEND);
        gl.blendFunc(gl.ONE, gl.ONE_MINUS_SRC_ALPHA);
        gl.clearColor(0, 0, 0, 0);
        gl.clear(gl.COLOR_BUFFER_BIT);
        const kx = ((PW / (X1 - X0)) * 2) / W,
          ky = ((PH / (Y1 - Y0)) * 2) / H;
        gl.uniform4f(
          gl.getUniformLocation(p, 'm'),
          kx,
          ((L - (X0 * PW) / (X1 - X0)) * 2) / W - 1,
          ky,
          ((B - (Y0 * PH) / (Y1 - Y0)) * 2) / H - 1,
        );
        const loc = gl.getAttribLocation(p, 'a'),
          cl = gl.getUniformLocation(p, 'col');
        for (const s of scT) {
          const n = s.x.length,
            buf = new Float32Array(n * 3);
          for (let i = 0; i < n; i++) {
            buf[3 * i] = s.x[i];
            buf[3 * i + 1] = s.y[i];
            buf[3 * i + 2] = s.r[i];
          }
          gl.bindBuffer(gl.ARRAY_BUFFER, gl.createBuffer());
          gl.bufferData(gl.ARRAY_BUFFER, buf, gl.STATIC_DRAW);
          gl.enableVertexAttribArray(loc);
          gl.vertexAttribPointer(loc, 3, gl.FLOAT, false, 0, 0);
          const h = s.color;
          gl.uniform4f(
            cl,
            parseInt(h.slice(1, 3), 16) / 255,
            parseInt(h.slice(3, 5), 16) / 255,
            parseInt(h.slice(5, 7), 16) / 255,
            0.7,
          );
          gl.drawArrays(gl.POINTS, 0, n);
        }
      },
      'st-full'() {
        const ctx = c.getContext('2d');
        const xm = Math.max(...sv.map(s => s.points.at(-1).x));
        scales.x = { min: 0, max: xm };
        scales.y = { min: 0, max: 1 };
        ctx.lineWidth = 1.5;
        for (const s of sv) {
          const path = new Path2D();
          let py = null;
          for (const p of s.points) {
            const px = valToPos(p.x, 'x'),
              y = valToPos(p.y, 'y');
            if (py === null) path.moveTo(px, y);
            else {
              path.lineTo(px, py);
              path.lineTo(px, y);
            }
            py = y;
          }
          ctx.strokeStyle = s.color;
          ctx.stroke(path);
        }
      },
      'st-decim'() {
        const ctx = c.getContext('2d');
        let xm = 0;
        for (const s of svT) xm = Math.max(xm, s.x[s.x.length - 1]);
        const kx = PW / xm;
        ctx.lineWidth = 1.5;
        for (const s of svT) {
          const path = new Path2D();
          const { x, y } = s;
          let col = -1,
            lo = 0,
            hi = 0,
            last = 0;
          for (let i = 0; i < x.length; i++) {
            const px = (L + x[i] * kx + 0.5) | 0,
              yy = T + PH - y[i] * PH;
            if (px !== col) {
              if (col < 0) path.moveTo(px, yy);
              else {
                path.lineTo(col, lo);
                path.lineTo(col, hi);
                path.lineTo(col, last);
                path.lineTo(px, last);
              }
              col = px;
              lo = hi = yy;
            } else {
              if (yy < lo) lo = yy;
              if (yy > hi) hi = yy;
            }
            last = yy;
          }
          path.lineTo(col, lo);
          path.lineTo(col, hi);
          path.lineTo(col, last);
          ctx.strokeStyle = s.color;
          ctx.stroke(path);
        }
      },
    };
    window.run = () =>
      new Promise(res => {
        const t0 = performance.now();
        variants[v]();
        const js = performance.now() - t0;
        requestAnimationFrame(() => requestAnimationFrame(() => res({ js, frame: performance.now() - t0 })));
      });
    window.ready = true;
  </script>
</body>
